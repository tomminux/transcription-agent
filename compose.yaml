services:
  transcription-agent:
    # No `platform:` pin: build and run natively (arm64 on Apple Silicon).
    build:
      context: .
    image: transcription-agent:local
    restart: unless-stopped
    init: true # reaps zombies and forwards SIGTERM
    # Run as the Mac user so files written to the mounted folders belong to you.
    # HOST_UID/HOST_GID come from .env (create it with scripts/setup.sh).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      TA_MODEL: "${TA_MODEL:-/models/ggml-base.bin}"
      TA_LANGUAGE: "${TA_LANGUAGE:-auto}"
      TA_SCAN_INTERVAL_SECS: "${TA_SCAN_INTERVAL_SECS:-5}"
      RUST_LOG: "${RUST_LOG:-info}"
      # Meeting report (off by default). See README "Meeting reports".
      TA_LLM: "${TA_LLM:-none}"
      TA_LLM_DEFAULT: "${TA_LLM_DEFAULT:-none}"
      TA_LLM_MODEL: "${TA_LLM_MODEL:-}"
      TA_LLM_URL: "${TA_LLM_URL:-}"
      TA_LLM_API_KEY: "${TA_LLM_API_KEY:-}"
      # Never empty: an empty value breaks older images. The default is the
      # image's system CA bundle (same as public roots plus none of yours).
      TA_LLM_CA_CERT: "${TA_LLM_CA_CERT:-/etc/ssl/certs/ca-certificates.crt}"
      TA_LLM_NUM_CTX: "${TA_LLM_NUM_CTX:-32768}"
      TA_REPORT_LANGUAGE: "${TA_REPORT_LANGUAGE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # One parent folder holding new-audio-files/, transcriptions/ and
      # transcribed-audio-files/ (created by the agent if missing).
      - ${HOST_DATA_DIR:-/Users/paolo/docker-host-containers/transcription-agent}:/data
      - ${HOST_MODELS_DIR:-./models}:/models:ro
    # Whisper is CPU/RAM hungry: give Docker Desktop/Colima enough CPUs and
    # at least ~2 GB RAM for the base model.
